name: Backend CI

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest

    env:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ci-password
      POSTGRES_DB: expenses
      DATABASE_URL: postgresql://postgres:ci-password@db:5432/expenses

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install Python dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Compile Python source
        run: python -m compileall -q main.py auth database repositories routes schemas services

      - name: Validate Docker Compose configuration
        run: docker compose config

      - name: Build and start Docker services
        run: docker compose up -d --build

      - name: Check FastAPI is responding
        run: curl --fail --retry 10 --retry-delay 3 http://127.0.0.1:8000/docs

      - name: Show service logs on failure
        if: failure()
        run: docker compose logs

      - name: Stop Docker services
        if: always()
        run: docker compose down -v